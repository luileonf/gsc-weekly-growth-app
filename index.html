<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSC | Informe de Coberturas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <section class="current-week-panel" aria-label="Agenda por semana">
          <div class="current-week-heading">
            <div class="agenda-brand">
              <img
                class="agenda-logo"
                src="./assets/logo-gsc.png"
                alt="GSC Sports Corporation"
              />
              <div>
                <p class="eyebrow">Agenda del equipo</p>
                <h2>Agenda por semana</h2>
              </div>
            </div>
            <div class="agenda-controls">
              <span id="currentWeekLabel"></span>
              <button id="refreshSheets" class="icon-button agenda-refresh" type="button" aria-label="Actualizar desde Sheets" title="Actualizar desde Sheets">
                ↻
              </button>
              <div class="agenda-week-row" id="agendaWeekButtons" aria-label="Semana de agenda"></div>
              <p class="sync-feedback agenda-sync" id="syncFeedback">Listo para sincronizar con el Google Sheet real.</p>
            </div>
          </div>
          <div class="schedule-grid" id="currentWeekRows"></div>
        </section>

        <section class="filter-block" aria-label="Filtros">
          <select id="personFilter" class="sr-only" aria-label="Persona"></select>
          <select id="monthFilter" class="sr-only" aria-label="Mes"></select>
          <select id="semesterFilter" class="sr-only" aria-label="Semana"></select>

          <div class="filter-card people-filter">
            <span class="filter-caption">Persona</span>
            <div class="person-switcher" id="personButtons" aria-label="Personas"></div>
          </div>
          <div class="filter-card month-filter">
            <span class="filter-caption">Mes</span>
            <div class="chip-row" id="monthButtons" aria-label="Mes"></div>
          </div>
          <div class="filter-card">
            <span class="filter-caption">Semana</span>
            <div class="chip-row compact" id="semesterButtons" aria-label="Semana"></div>
          </div>
        </section>

        <section class="view is-active" id="dashboardView">
          <div class="kpi-grid" id="kpiGrid"></div>

          <section class="panel person-panel">
            <div class="panel-heading">
              <h2>Resumen de facturación</h2>
              <span id="personCardsLabel"></span>
            </div>
            <div class="person-grid" id="personCards"></div>
          </section>

          <div class="report-grid">
            <section class="panel">
              <div class="panel-heading">
                <h2>Por semana</h2>
                <span id="weekTotalLabel"></span>
              </div>
              <div class="week-grid" id="weekGrid"></div>
            </section>
          </div>

          <section class="panel">
            <div class="panel-heading">
              <h2>Detalle filtrado</h2>
              <span id="recordCountLabel"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Responsable</th>
                    <th>Cobertura</th>
                    <th>Sede</th>
                    <th>Programa</th>
                    <th>Conteo</th>
                    <th>Monto</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody id="recordsTable"></tbody>
              </table>
            </div>
          </section>

          <section class="panel consolidated-panel">
            <div class="panel-heading">
              <h2>Totales del equipo</h2>
              <span id="periodTotalLabel"></span>
            </div>
            <div class="period-grid" id="periodGrid"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
    <script src="./week-fix.js"></script>
    <script src="./sort-fix.js"></script>
    <script src="./agenda-design.js"></script>
  </body>
</html>
